<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Huerto</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #faf9fc;
            margin: 0;
            padding: 20px;
            color: #103035;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.08);
            padding: 24px 16px 32px 16px;
        }
        main {
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #37c3d1;
            margin-bottom: 24px;
            font-size: 2rem;
        }
        .main-circle {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px auto;
        }
        .humidity-circle {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            font-weight: bold;
            color: #000000;
            margin-bottom: 10px;
            transition: background 0.5s;
            box-shadow: 0 2px 10px rgba(16,48,53,0.08);
        }
        .status-label {
            font-size: 1.3rem;
            font-weight: 600;
            padding: 6px 18px;
            border-radius: 20px;
            margin-top: 8px;
            color: #faf9fc;
            display: inline-block;
        }
        .timestamp {
            font-size: 1rem;
            color: #103035;
            text-align: center;
            margin: 12px 0 18px 0;
        }
        .btn {
            border: none;
            padding: 16px 0;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 1.2rem;
            font-weight: bold;
            margin: 0 auto 24px auto;
            display: block;
            transition: background 0.3s;
        }
        .btn-refresh {
            background-color: #37c3d1;
            color: #faf9fc;
        }
        .btn-refresh:hover {
            background-color: #9dc4f9;
            color: #103035;
        }
        .btn-calibrate {
            background-color: #ffa726;
            color: #faf9fc;
        }
        .btn-accept {
            background-color: #37c3d1;
            color: #faf9fc;
            padding: 12px 32px;
            font-size: 1.1rem;
        }
        .stats {
            margin-top: 10px;
            width: 100%;
        }
        .stats h2 {
            font-size: 1.1rem;
            color: #103035;
            margin-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
            margin-top: 0;
        }
        table th, table td {
            padding: 10px 0;
            text-align: center;
            border: none;
            font-size: 1.1rem;
        }
        table th {
            background-color: #c0efe1;
            color: #103035;
            font-weight: 700;
            border-radius: 8px 8px 0 0;
        }
        table tr {
            border-radius: 8px;
        }
        .history-row {
            border-radius: 8px;
            color: #000000;
        }
        .row-dry { background: #2b2929; }
        .row-seco { background: #000000; color: #faf9fc; }
        .row-optimo { background: #c0efe1; }
        .row-humedo { background:#37c3d1 ; color: #faf9fc; }
        .row-muyhumedo { background: #103035 ; color: #faf9fc; }
        .humidity-circle.row-dry { background: #2b2929; color: #faf9fc; }
        .humidity-circle.row-seco { background: #000000; color: #faf9fc; }
        .humidity-circle.row-humedo { background: #37c3d1; color: #faf9fc; }
        .humidity-circle.row-optimo { background: #c0efe1; color: #000000; }
        .humidity-circle.row-muyhumedo { background: #103035; color: #faf9fc; }
        .status-label.row-dry { background: #2b2929; color: #faf9fc; }
        .status-label.row-seco { background: #000000; color: #faf9fc; }
        .status-label.row-humedo { background: #37c3d1; color: #faf9fc; }
        .status-label.row-optimo { background: #c0efe1; color: #000000; }
        .status-label.row-muyhumedo { background: #103035; color: #faf9fc; }
        .visually-hidden { position: absolute; left: -10000px; top: auto; width: 1px; height: 1px; overflow: hidden; }
        @media (max-width: 500px) {
            .container { padding: 8px; }
            .humidity-circle { width: 120px; height: 120px; font-size: 2rem; }
        }
    </style>
</head>
<body>
    <main>
        <div class="container" id="main-container">
            <header>
                <h1>Monitor Humedad Suelo</h1>
            </header>
            <section class="main-circle" aria-label="Lectura actual de humedad">
                <div id="humidity-circle" class="humidity-circle" aria-live="polite">--%</div>
                <div id="status-label" class="status-label" style="background:#9dc4f9;">--</div>
            </section>
            <div class="timestamp" aria-live="polite">Última actualización: <span id="last-update">--:--:--</span> (Próxima en <span id="countdown">30</span>s)</div>
            <button id="refresh-btn" class="btn btn-refresh" type="button">Actualizar Datos</button>
            <button id="calibrate-btn" class="btn btn-calibrate" type="button">Calibración</button>
            <section class="stats" aria-label="Historial de lecturas">
                <h2>Historial de Lecturas</h2>
                <table>
                    <thead>
                        <tr>
                            <th scope="col">Fecha y Hora</th>
                            <th scope="col">Humedad (%)</th>
                            <th scope="col">Estado</th>
                        </tr>
                    </thead>
                    <tbody id="history-table">
                        <!-- Datos se llenarán con JavaScript -->
                    </tbody>
                </table>
            </section>
        </div>
        <!-- Sección de calibración movida fuera del contenedor principal -->
        <section id="calibration-section" style="display:none;flex-direction:column;align-items:center;justify-content:center;max-width:400px;margin:0 auto;background-color:white;border-radius:16px;box-shadow:0 0 15px rgba(0,0,0,0.08);padding:24px 16px 32px 16px;" aria-label="Calibración del sensor">
            <h2>Calibración del Sensor</h2>
            <div id="raw-value" style="font-size:2rem;margin:20px 0;">--</div>
            <div id="calibration-error" style="color:#d32f2f;font-size:1rem;display:none;"></div>
            <button id="accept-btn" class="btn btn-accept" type="button">Aceptar</button>
        </section>
    </main>
    <script>
    (function() {
        // Almacenamiento de lecturas
        const readings = [];
        const MAX_HISTORY = 10;
        let countdownInterval;
        let secondsLeft = 30;
        let calibrationInterval = null;
        // Devuelve el color de fondo y estado para el círculo y la etiqueta
        function getVisualState(humidity) {
            if (humidity === null) return { row: 'row-dry', label: '--' };
            if (humidity < 20) return { row: 'row-dry', label: 'Muy seco' };
            if (humidity < 45) return { row: 'row-seco', label: 'Seco' };
            if (humidity < 70) return { row: 'row-optimo', label: 'Óptimo' };
            if (humidity < 75) return { row: 'row-humedo', label: 'Húmedo' };
            return { row: 'row-muyhumedo', label: 'Muy húmedo' };
        }
        // Función para obtener datos del sensor (API real)
        async function fetchSensorData() {
            try {
                const response = await fetch('/sensor');
                if (!response.ok) {
                    throw new Error('Error al obtener datos del sensor');
                }
                const data = await response.json();
                const humidity = data.humedadSuelo;
                const now = new Date();
                const timeString = now.toLocaleTimeString();
                const dateTimeString = now.toLocaleString();
                readings.unshift({ timestamp: dateTimeString, humidity: humidity });
                if (readings.length > MAX_HISTORY) {
                    readings.pop();
                }
                return { humidity, timestamp: timeString };
            } catch (error) {
                showError('No se pudo obtener la humedad del sensor.');
                return { humidity: null, timestamp: new Date().toLocaleTimeString(), error: true };
            }
        }
        // Actualiza la interfaz principal
        async function updateUI() {
            resetCountdown();
            const circle = document.getElementById('humidity-circle');
            const label = document.getElementById('status-label');
            circle.textContent = "...";
            label.textContent = "Actualizando...";
            circle.className = 'humidity-circle';
            label.className = 'status-label';
            const data = await fetchSensorData();
            if (data.error) {
                circle.textContent = "Error";
                label.textContent = "Error de conexión";
                circle.className = 'humidity-circle row-dry';
                label.className = 'status-label row-dry';
            } else {
                circle.textContent = data.humidity + '%';
                const visual = getVisualState(data.humidity);
                label.textContent = visual.label;
                circle.className = 'humidity-circle ' + visual.row;
                label.className = 'status-label ' + visual.row;
                document.getElementById('last-update').textContent = data.timestamp;
            }
            updateHistory();
        }
        // Actualiza la tabla de historial
        function updateHistory() {
            const tableBody = document.getElementById('history-table');
            while (tableBody.firstChild) tableBody.removeChild(tableBody.firstChild);
            readings.slice(0, MAX_HISTORY).forEach(reading => {
                const visual = getVisualState(reading.humidity);
                const row = document.createElement('tr');
                row.className = 'history-row ' + visual.row;
                const timeCell = document.createElement('td');
                timeCell.textContent = reading.timestamp;
                const humidityCell = document.createElement('td');
                humidityCell.textContent = reading.humidity + '%';
                const estadoCell = document.createElement('td');
                estadoCell.textContent = visual.label;
                row.appendChild(timeCell);
                row.appendChild(humidityCell);
                row.appendChild(estadoCell);
                tableBody.appendChild(row);
            });
        }
        // Función para actualizar el contador de cuenta regresiva
        function updateCountdown() {
            secondsLeft--;
            document.getElementById('countdown').textContent = secondsLeft;
            if (secondsLeft <= 0) {
                updateUI();
            }
        }
        // Función para reiniciar el contador
        function resetCountdown() {
            clearInterval(countdownInterval);
            secondsLeft = 30;
            document.getElementById('countdown').textContent = secondsLeft;
            countdownInterval = setInterval(updateCountdown, 1000);
        }
        // --- Calibración ---
        async function fetchRawSensorData() {
            try {
                const response = await fetch('/sensor/raw');
                if (!response.ok) throw new Error('Error al obtener valor crudo');
                const data = await response.json();
                hideCalibrationError();
                return data.valorCrudo;
            } catch (e) {
                showCalibrationError('No se pudo obtener el valor crudo del sensor.');
                return '--';
            }
        }
        function showCalibration() {
            document.getElementById('main-container').style.display = 'none';
            document.getElementById('calibration-section').style.display = 'flex';
            document.getElementById('raw-value').textContent = '...';
            fetchAndUpdateRawValue();
            calibrationInterval = setInterval(fetchAndUpdateRawValue, 5000);
        }
        function hideCalibration() {
            document.getElementById('main-container').style.display = '';
            document.getElementById('calibration-section').style.display = 'none';
            clearInterval(calibrationInterval);
        }
        async function fetchAndUpdateRawValue() {
            const valor = await fetchRawSensorData();
            document.getElementById('raw-value').textContent = valor;
        }
        function showError(msg) {
            // Puedes mostrar un toast, modal o mensaje visible
            alert(msg); // Simple para microcontrolador
        }
        function showCalibrationError(msg) {
            const el = document.getElementById('calibration-error');
            el.textContent = msg;
            el.style.display = 'block';
        }
        function hideCalibrationError() {
            const el = document.getElementById('calibration-error');
            el.textContent = '';
            el.style.display = 'none';
        }
        // Inicializar y configurar actualizaciones
        document.addEventListener('DOMContentLoaded', function() {
            updateUI();
            document.getElementById('refresh-btn').addEventListener('click', updateUI);
            document.getElementById('calibrate-btn').addEventListener('click', showCalibration);
            document.getElementById('accept-btn').addEventListener('click', hideCalibration);
            countdownInterval = setInterval(updateCountdown, 1000);
        });
    })();
    </script>
</body>
</html>
